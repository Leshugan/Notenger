name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Установить зависимости
        run: npm install --legacy-peer-deps

      - name: Собрать веб-приложение
        run: npm run build

      - name: Зафиксировать appId (имя пакета)
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "leshugan.notenger",
            "appName": "Notenger",
            "webDir": "dist"
          }
          EOF
          echo "=== capacitor.config.json ==="; cat capacitor.config.json

      - name: Добавить Android-проект (Capacitor)
        run: |
          # Удаляем возможную старую папку android (в ней мог остаться чужой appId)
          rm -rf android
          npx cap add android || npx cap sync android
          npx cap sync android

      - name: Установить иконку приложения
        run: |
          set -e
          mkdir -p android/app/src/main/res/mipmap-mdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/mipmap-hdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          echo '' | base64 -d > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true

      - name: Прописать разрешения и версию
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>'
          if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i "s|<application|$PERMS\n    <application|" "$MANIFEST"
          fi
          GRADLE=android/app/build.gradle
          sed -i 's/versionCode .*/versionCode 2/' "$GRADLE"
          sed -i 's/versionName .*/versionName "0.2"/' "$GRADLE"
          # Принудительно задаём имя пакета — ловим оба формата (с '=' и без)
          sed -i -E 's/applicationId[[:space:]]*=?[[:space:]]*"[^"]*"/applicationId "leshugan.notenger"/' "$GRADLE"
          sed -i -E 's/namespace[[:space:]]*=?[[:space:]]*"[^"]*"/namespace "leshugan.notenger"/' "$GRADLE"
          echo "=== build.gradle (id) ==="; grep -E "applicationId|namespace" "$GRADLE"
          # Защита: если appId всё ещё не наш — остановить сборку с понятной ошибкой
          if ! grep -q "leshugan.notenger" "$GRADLE"; then echo "ОШИБКА: appId не установлен!"; exit 1; fi
          echo "=== Manifest head ==="; head -30 "$MANIFEST"

      - name: Разрешить WebView доступ + авто-запрос разрешений
        run: |
          MA=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          echo "MainActivity: $MA"
          PKG=$(grep -m1 '^package' "$MA" | sed 's/package //;s/;//')
          cat > "$MA" <<EOF
          package $PKG;
          import android.os.Build;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.media.MediaRecorder;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import java.io.File;
          import java.io.FileInputStream;
          import java.util.ArrayList;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private ValueCallback<Uri[]> filePathCallback;
            private ActivityResultLauncher<Intent> fileChooserLauncher;
            private MediaRecorder audioRec;
            private String audioPath;
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              requestStartupPermissions();
              fileChooserLauncher = registerForActivityResult(
                new ActivityResultContracts.StartActivityForResult(),
                result -> {
                  if (filePathCallback == null) return;
                  Uri[] uris = null;
                  if (result.getResultCode() == RESULT_OK && result.getData() != null) {
                    Intent data = result.getData();
                    if (data.getClipData() != null) {
                      int n = data.getClipData().getItemCount();
                      uris = new Uri[n];
                      for (int i = 0; i < n; i++) uris[i] = data.getClipData().getItemAt(i).getUri();
                    } else if (data.getData() != null) {
                      uris = new Uri[]{ data.getData() };
                    }
                  }
                  filePathCallback.onReceiveValue(uris);
                  filePathCallback = null;
                });
              // Настройки WebView для корректного захвата аудио/медиа
              try {
                android.webkit.WebSettings ws = this.bridge.getWebView().getSettings();
                ws.setMediaPlaybackRequiresUserGesture(false);
                ws.setJavaScriptEnabled(true);
                ws.setDomStorageEnabled(true);
              } catch (Exception ignore) {}
              // Нативная запись звука (минуя WebView/getUserMedia)
              this.bridge.getWebView().addJavascriptInterface(new Object(){
                @JavascriptInterface
                public boolean startRec(){
                  try{
                    stopRecInternal(false);
                    audioPath = getCacheDir().getAbsolutePath() + "/voice_" + System.currentTimeMillis() + ".m4a";
                    audioRec = new MediaRecorder();
                    audioRec.setAudioSource(MediaRecorder.AudioSource.MIC);
                    audioRec.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                    audioRec.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                    audioRec.setAudioEncodingBitRate(64000);
                    audioRec.setAudioSamplingRate(44100);
                    audioRec.setOutputFile(audioPath);
                    audioRec.prepare();
                    audioRec.start();
                    return true;
                  }catch(Exception e){ try{ if(audioRec!=null){audioRec.release();audioRec=null;} }catch(Exception ignore){} return false; }
                }
                @JavascriptInterface
                public String stopRec(){
                  return stopRecInternal(true);
                }
                @JavascriptInterface
                public void cancelRec(){ stopRecInternal(false); }
                @JavascriptInterface
                public void vibrate(int ms){
                  try{
                    android.os.Vibrator v=(android.os.Vibrator)getSystemService(android.content.Context.VIBRATOR_SERVICE);
                    if(v!=null&&v.hasVibrator()){
                      if(android.os.Build.VERSION.SDK_INT>=26){ v.vibrate(android.os.VibrationEffect.createOneShot(ms, android.os.VibrationEffect.DEFAULT_AMPLITUDE)); }
                      else { v.vibrate(ms); }
                    }
                  }catch(Exception e){}
                }
              }, "AndroidRec");
              this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                @Override
                public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(new Runnable() {
                    @Override public void run() { request.grant(request.getResources()); }
                  });
                }
                @Override
                public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> cb, FileChooserParams params) {
                  if (filePathCallback != null) { filePathCallback.onReceiveValue(null); }
                  filePathCallback = cb;
                  Intent intent = params.createIntent();
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  try { fileChooserLauncher.launch(intent); } catch (Exception e) { filePathCallback = null; return false; }
                  return true;
                }
              });
              // Сохранение файлов (экспорт): ловим data:/blob: загрузки и пишем в папку Notenger
              final android.content.Context ctx = this;
              this.bridge.getWebView().setDownloadListener(new android.webkit.DownloadListener() {
                @Override
                public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                  try {
                    String fileName = "notenger_backup.json";
                    if (contentDisposition != null && contentDisposition.contains("filename=")) {
                      fileName = contentDisposition.substring(contentDisposition.indexOf("filename=")+9).replace("\\"","").trim();
                    }
                    byte[] bytes = null;
                    if (url.startsWith("data:")) {
                      int comma = url.indexOf(',');
                      String meta = url.substring(0, comma);
                      String dataPart = url.substring(comma+1);
                      if (meta.contains("base64")) bytes = android.util.Base64.decode(dataPart, android.util.Base64.DEFAULT);
                      else bytes = java.net.URLDecoder.decode(dataPart, "UTF-8").getBytes();
                    }
                    if (bytes == null) return;
                    java.io.File dir = new java.io.File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "Notenger");
                    if (!dir.exists()) dir.mkdirs();
                    java.io.File out = new java.io.File(dir, fileName);
                    java.io.FileOutputStream fos = new java.io.FileOutputStream(out);
                    fos.write(bytes); fos.close();
                    runOnUiThread(new Runnable(){ public void run(){ android.widget.Toast.makeText(ctx, "Сохранено: Download/Notenger/"+out.getName(), android.widget.Toast.LENGTH_LONG).show(); }});
                  } catch (final Exception e) {
                    runOnUiThread(new Runnable(){ public void run(){ android.widget.Toast.makeText(ctx, "Ошибка сохранения", android.widget.Toast.LENGTH_SHORT).show(); }});
                  }
                }
              });
            }
            private String stopRecInternal(boolean wantData){
              String result = null;
              try{
                if(audioRec!=null){
                  try{ audioRec.stop(); }catch(Exception ignore){}
                  try{ audioRec.release(); }catch(Exception ignore){}
                  audioRec=null;
                  if(wantData && audioPath!=null){
                    File f=new File(audioPath);
                    if(f.exists() && f.length()>0){
                      FileInputStream fis=new FileInputStream(f);
                      byte[] data=new byte[(int)f.length()];
                      fis.read(data); fis.close();
                      result = "data:audio/mp4;base64," + Base64.encodeToString(data, Base64.NO_WRAP);
                    }
                  }
                }
              }catch(Exception e){ result=null; }
              try{ if(audioPath!=null){ new File(audioPath).delete(); } }catch(Exception ignore){}
              audioPath=null;
              return result;
            }
            private void requestStartupPermissions() {
              ArrayList<String> need = new ArrayList<>();
              String[] perms;
              if (Build.VERSION.SDK_INT >= 33) {
                perms = new String[]{ Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA,
                  Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_AUDIO };
              } else {
                perms = new String[]{ Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA,
                  Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE };
              }
              for (String p : perms) {
                if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) need.add(p);
              }
              if (!need.isEmpty()) {
                ActivityCompat.requestPermissions(this, need.toArray(new String[0]), 1001);
              }
            }
          }
          EOF
          echo "=== MainActivity.java ==="; cat "$MA"

      - name: Подготовить постоянный ключ подписи
        run: |
          # Подменяем стандартный debug-keystore нашим фиксированным,
          # чтобы подпись не менялась между сборками (приложение ставится поверх).
          if [ ! -f notenger.keystore.b64 ]; then
            echo "ОШИБКА: нет файла notenger.keystore.b64 в корне репозитория."; exit 1
          fi
          mkdir -p android/app
          base64 -d notenger.keystore.b64 > android/app/debug.keystore
          # Указываем gradle использовать именно его (стандартные debug-параметры)
          GRADLE=android/app/build.gradle
          if ! grep -q "signingConfigs" "$GRADLE"; then
            sed -i 's|android {|android {\n    signingConfigs { debug { storeFile file("debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }|' "$GRADLE"
          fi
          echo "=== signing ==="; grep -n "signingConfigs\|debug.keystore" "$GRADLE" || true

      - name: Собрать APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Загрузить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
